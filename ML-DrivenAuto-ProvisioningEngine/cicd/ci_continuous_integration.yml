name: CI - Continuous Integration

# Trigger on every push and pull request
on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '18'

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install linting dependencies
        run: |
          pip install --upgrade pip
          pip install black flake8 pylint isort mypy bandit safety
      
      - name: Code formatting check (Black)
        run: |
          black --check --diff .
        continue-on-error: true
      
      - name: Import sorting check (isort)
        run: |
          isort --check-only --diff .
        continue-on-error: true
      
      - name: Linting (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Code analysis (Pylint)
        run: |
          pylint ml_engine/ api/ provisioning_engine/ --exit-zero --output-format=colorized
        continue-on-error: true
      
      - name: Type checking (MyPy)
        run: |
          mypy ml_engine/ api/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true
      
      - name: Security scan (Bandit)
        run: |
          bandit -r ml_engine/ api/ provisioning_engine/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Dependency security check (Safety)
        run: |
          safety check --json
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  dependency-check:
    name: Dependency Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Validate requirements files
        run: |
          pip install pip-tools
          pip-compile --dry-run ml_engine/requirements.txt
          pip-compile --dry-run api/requirements.txt
          pip-compile --dry-run provisioning_engine/requirements.txt
      
      - name: Check for dependency conflicts
        run: |
          pip install pip-conflict-checker
          pip-conflict-checker
        continue-on-error: true
      
      - name: License compliance check
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file=licenses.json
      
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json

  build-components:
    name: Build All Components
    runs-on: ubuntu-latest
    needs: [code-quality, dependency-check]
    
    strategy:
      matrix:
        component: [ml_engine, api, provisioning_engine]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install component dependencies
        run: |
          pip install --upgrade pip
          pip install -r ${{ matrix.component }}/requirements.txt
      
      - name: Compile Python files
        run: |
          python -m py_compile ${{ matrix.component }}/*.py
      
      - name: Create component package
        run: |
          python setup.py sdist bdist_wheel
        continue-on-error: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.component }}
          path: dist/

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-components
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ml-autoprov-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/api-image.tar
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/api-image.tar
          retention-days: 7

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ml-autoprov
            -Dsonar.organization=your-org
            -Dsonar.python.version=3.9
        continue-on-error: true
      
      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  validate-infrastructure:
    name: Validate IaC Templates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform format check
        run: |
          terraform fmt -check -recursive infrastructure/terraform/
        continue-on-error: true
      
      - name: Terraform validate
        run: |
          cd infrastructure/terraform/
          terraform init -backend=false
          terraform validate
        continue-on-error: true
      
      - name: Set up Pulumi
        uses: pulumi/setup-pulumi@v2
      
      - name: Pulumi preview (dry-run)
        run: |
          cd infrastructure/pulumi/
          pulumi preview --stack dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        continue-on-error: true
      
      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f infrastructure/k8s/

  integration-build:
    name: Integration Build Check
    runs-on: ubuntu-latest
    needs: [build-components, build-docker, validate-infrastructure]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Verify build completeness
        run: |
          echo "Checking all build artifacts..."
          ls -R
          
          # Verify critical files exist
          test -f docker-image/api-image.tar
          
          echo "✓ All integration builds successful"
      
      - name: Generate build report
        run: |
          cat << EOF > build-report.md
          # Build Report
          
          ## Commit: ${{ github.sha }}
          ## Branch: ${{ github.ref }}
          ## Timestamp: $(date -u)
          
          ### Components Built
          - ML Engine: ✓
          - API: ✓
          - Provisioning Engine: ✓
          
          ### Docker Images
          - API Image: ✓
          
          ### Status: SUCCESS
          EOF
      
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md

  notify-integration:
    name: Notify Integration Status
    runs-on: ubuntu-latest
    needs: [code-quality, build-components, build-docker, validate-infrastructure, integration-build]
    if: always()
    
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            CI Pipeline: ${{ job.status }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
      
      - name: Update commit status
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}',
              context: 'CI/Integration',
              description: 'Continuous Integration pipeline'
            })